name: Poseidon Quality

on:
  pull_request:
  push:
    branches:
      - main
      - release/test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poseidon-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: pnpm run check

      - name: Build production bundle
        run: pnpm run build

      - name: Validate release configuration
        run: pnpm run release:check

  e2e:
    name: Release E2E
    needs:
      - quality
      - backend
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release/test'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm run test:e2e

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: poseidon-e2e-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend schema
    needs: quality
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release/test'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start disposable Supabase
        run: pnpm exec supabase start

      - name: Lint schema and run pgTAP
        run: pnpm run backend:check

      - name: Stop disposable Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
